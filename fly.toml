# fly.toml app configuration file for "msa-payments"

app = "msa-payments"
primary_region = "nrt" # Primary deployment region (Tokyo - near your users)

[build]

[env]
NODE_ENV = "production"

[http_service]
  internal_port = 3002       # Your app listens on port 3002
  force_https = true         # Redirect HTTP to HTTPS (recommended for production)
  auto_stop_machines = "stop" # Machines will stop automatically when idle
  auto_start_machines = true  # Machines will start automatically when traffic arrives
  min_machines_running = 0    # No machines will run unless traffic arrives
  max_machines_running = 1    # Limit to 1 machine to prevent scaling over free tier
  processes = ["app"]

[[vm]]
  size = 'shared-cpu-1x'
  memory = "256mb"           # Free tier limit (256MB memory per machine)
  cpu_kind = "shared"        # Shared CPU (Free tier eligible)
  cpus = 1                   # 1 CPU (Default and Free tier eligible)